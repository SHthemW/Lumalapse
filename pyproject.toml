[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smoothlapse"
version = "0.1.0"
description = "Timelapse RAW sequence editor: exposure curve preview, keyframe grading, deflicker, video export (LRTimelapse-like)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "rawpy>=0.21",
    "exifread>=3.0",
    "click>=8.1",
    "imageio-ffmpeg>=0.4.9",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]

[project.scripts]
smoothlapse = "smoothlapse.cli:main"

[tool.setuptools.packages.find]
include = ["smoothlapse*"]
